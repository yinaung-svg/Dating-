<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>YinAung - Live Player</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
      overflow: hidden;
    }

    /* အပေါ်ဘက် Top Bar (Open Link ဖယ်ထားပြီး LIVE / Portrait / Exit သာ ထားသည်) */
    .top-bar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 46px;
      padding: 0 10px;
      background: rgba(15, 15, 18, 0.92);
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 30;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .live-badge {
      background: #e11d48;
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      letter-spacing: 0.5px;
      flex-shrink: 0;
    }

    .title-text {
      font-size: 13px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .controls-group {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .ctrl-btn {
      background: rgba(255, 255, 255, 0.14);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 6px;
      padding: 5px 9px;
      font-size: 12px;
      cursor: pointer;
    }

    .ctrl-btn.exit-btn {
      background: rgba(239, 68, 68, 0.25);
      border-color: rgba(239, 68, 68, 0.45);
    }

    /* Video / Stream နေရာတစ်ခုတည်း ပေါ်စေမည့် Stage */
    .stage-wrapper {
      position: fixed;
      top: 46px;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100vw;
      height: calc(100dvh - 46px);
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .media-box {
      position: relative;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      transition: transform 0.2s ease, width 0.2s ease, height 0.2s ease;
    }

    /* Portrait Mode ထဲရောက်နေချိန် (သို့မဟုတ် အလျားလိုက် rotate လုပ်ချင်သည့်အခါ) */
    .media-box.rotated-landscape {
      width: 100dvh;
      height: 100vw;
      transform: rotate(90deg);
    }

    iframe, video {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: #000;
    }

    video {
      object-fit: contain;
    }

    /* Screen နှိပ်လိုက်တိုင်း အထဲက webpage/link ထဲ မဝင်အောင် ကာကွယ်ထားသော Shield */
    .click-shield {
      position: absolute;
      inset: 0;
      z-index: 15;
      background: transparent;
      /* ထဲက link/ad တွေကို မနှိပ်မိစေရန် block လုပ်ထားသည် */
    }

    .click-shield.unlocked {
      pointer-events: none; /* လိုအပ်လျှင် ခဏဖွင့်ကြည့်ရန်သာ */
    }
  </style>
</head>
<body>
  <!-- Open Link ခလုတ် မပါတော့ပါ -->
  <header class="top-bar" id="topBar">
    <div class="brand-group">
      <span class="live-badge">LIVE</span>
      <span class="title-text" id="streamTitle">YinAung - အစမ်း လေးပါဗျာ</span>
    </div>
    <div class="controls-group">
      <button class="ctrl-btn" id="orientationBtn" type="button">Portrait</button>
      <button class="ctrl-btn exit-btn" id="exitBtn" type="button">Exit</button>
    </div>
  </header>

  <main class="stage-wrapper" id="stageWrapper">
    <div class="media-box" id="mediaBox">
      <!-- Website URL အတွက် iframe -->
      <iframe
        id="webFrame"
        src=""
        allow="autoplay; encrypted-media; picture-in-picture"
        sandbox="allow-scripts allow-same-origin allow-forms"
        referrerpolicy="no-referrer"
      ></iframe>

      <!-- တိုက်ရိုက် .m3u8 / .mp4 stream ဖြစ်လျှင် သုံးရန် -->
      <video
        id="directVideo"
        style="display: none;"
        controls
        autoplay
        playsinline
        webkit-playsinline
      ></video>

      <!-- Screen နှိပ်လိုက်ရင် website/link ထဲ ဝင်မသွားအောင် ပိတ်ထားသည့် layer -->
      <div class="click-shield" id="clickShield" title="Link navigation locked"></div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <script>
    // URL query (?url=...) ပါရင် အဲ့ဒါကို ယူမယ်၊ မပါရင် ဒီမှာ website URL ထည့်ပါ
    const params = new URLSearchParams(window.location.search);
    const targetUrl = params.get('url') || 'https://example.com/your-live-page';
    const customTitle = params.get('title');

    const topBar = document.getElementById('topBar');
    const stageWrapper = document.getElementById('stageWrapper');
    const mediaBox = document.getElementById('mediaBox');
    const webFrame = document.getElementById('webFrame');
    const directVideo = document.getElementById('directVideo');
    const clickShield = document.getElementById('clickShield');
    const orientationBtn = document.getElementById('orientationBtn');
    const exitBtn = document.getElementById('exitBtn');
    const titleEl = document.getElementById('streamTitle');

    if (customTitle) {
      titleEl.textContent = customTitle;
    }

    // 1. Popup / window.open တွေနဲ့ ပြင်ပ link ဖွင့်တာကို တားဆီးခြင်း
    window.open = function () {
      return null;
    };

    // 2. Stream source ခွဲခြားပြီး ထည့်သွင်းခြင်း
    const isDirectVideo = /\.(m3u8|mp4|webm)(\?.*)?$/i.test(targetUrl);

    if (isDirectVideo) {
      webFrame.style.display = 'none';
      clickShield.style.display = 'none';
      directVideo.style.display = 'block';

      if (window.Hls && Hls.isSupported() && targetUrl.includes('.m3u8')) {
        const hls = new Hls();
        hls.loadSource(targetUrl);
        hls.attachMedia(directVideo);
      } else {
        directVideo.src = targetUrl;
      }
    } else {
      webFrame.src = targetUrl;
    }

    // 3. ဒေါင်လိုက် / အလျားလိုက် အခြေအနေအလိုက် Video နေရာတစ်ခုတည်း ညှိပေးခြင်း
    let isRotated = false;

    function syncLayout() {
      const isLandscapeDevice = window.innerWidth > window.innerHeight;

      if (isLandscapeDevice) {
        // ဖုန်းကို အလျားလိုက် (Landscape) လှည့်ထားချိန်: top bar ကို ဖျောက်ပြီး screen တစ်ခုလုံး video/stream နေရာပဲ ပြမယ်
        isRotated = false;
        mediaBox.classList.remove('rotated-landscape');
        topBar.style.display = 'none';
        stageWrapper.style.top = '0';
        stageWrapper.style.height = '100dvh';
        mediaBox.style.width = '100vw';
        mediaBox.style.height = '100dvh';
        orientationBtn.textContent = 'Landscape';
      } else {
        // ဖုန်းကို ဒေါင်လိုက် (Portrait) ကိုင်ထားချိန်
        topBar.style.display = 'flex';
        stageWrapper.style.top = '46px';
        stageWrapper.style.height = 'calc(100dvh - 46px)';

        if (isRotated) {
          mediaBox.style.width = '';
          mediaBox.style.height = '';
          mediaBox.classList.add('rotated-landscape');
          orientationBtn.textContent = 'Portrait';
        } else {
          mediaBox.classList.remove('rotated-landscape');
          mediaBox.style.width = '100%';
          mediaBox.style.height = '100%';
          orientationBtn.textContent = 'Portrait';
        }
      }
    }

    orientationBtn.addEventListener('click', () => {
      if (window.innerWidth <= window.innerHeight) {
        isRotated = !isRotated;
        syncLayout();
      }
    });

    exitBtn.addEventListener('click', () => {
      webFrame.src = 'about:blank';
      directVideo.pause();
      directVideo.removeAttribute('src');
      if (window.history.length > 1) {
        window.history.back();
      }
    });

    window.addEventListener('resize', syncLayout);
    window.addEventListener('orientationchange', () => setTimeout(syncLayout, 150));
    syncLayout();
  </script>
</body>
</html>
