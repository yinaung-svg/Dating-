<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dating Chat</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 min-h-screen flex flex-col">

    <!-- Auth Container -->
    <div id="auth-container" class="flex items-center justify-center min-h-screen p-4">
        <div class="bg-white p-6 rounded-xl shadow-lg w-full max-w-md border text-center">
            <!-- App Logo from GitHub repository -->
            <div class="flex justify-center mb-3">
                <img src="logo.png" alt="DC Logo" class="w-24 h-24 rounded-2xl object-cover shadow-md border-2 border-pink-500" onerror="this.src='https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=150&auto=format&fit=crop&q=80'">
            </div>
            <h1 class="text-3xl font-bold text-pink-500 mb-6">Dating Chat</h1>
            <div id="auth-error" class="hidden bg-red-100 text-red-600 p-3 rounded-lg mb-4 text-sm"></div>
            
            <form id="auth-form" onsubmit="handleAuth(event)" class="text-left">
                <div id="username-field" class="mb-4 hidden">
                    <label class="block text-sm font-medium mb-1">Username</label>
                    <input type="text" id="username" class="w-full p-3 rounded-lg border focus:outline-none focus:border-pink-500">
                </div>
                <div class="mb-4">
                    <label class="block text-sm font-medium mb-1">Email</label>
                    <input type="email" id="email" required class="w-full p-3 rounded-lg border focus:outline-none focus:border-pink-500">
                </div>
                <div class="mb-4">
                    <label class="block text-sm font-medium mb-1">Password</label>
                    <input type="password" id="password" required class="w-full p-3 rounded-lg border focus:outline-none focus:border-pink-500">
                </div>
                <button type="submit" id="auth-btn" class="w-full bg-pink-500 hover:bg-pink-600 text-white font-bold p-3 rounded-lg transition">Log In</button>
            </form>
            
            <div class="text-center mt-4">
                <button type="button" onclick="toggleAuthMode()" id="auth-toggle-btn" class="text-sm text-pink-500 hover:underline">Create new account</button>
            </div>
        </div>
    </div>

    <!-- Main App Container -->
    <div id="app-container" class="hidden flex flex-col h-screen">
        <header class="bg-white border-b px-4 py-3 flex items-center justify-between">
            <div class="flex items-center space-x-2">
                <img src="logo.png" alt="Logo" class="w-8 h-8 rounded-lg object-cover">
                <span class="text-2xl font-bold text-pink-500">Dating Chat</span>
            </div>
            <button onclick="logout()" class="bg-red-100 text-red-600 px-4 py-2 rounded-lg text-sm font-semibold">Logout</button>
        </header>
        <div class="flex flex-1 overflow-hidden">
            <div class="w-full md:w-80 bg-white border-r flex flex-col">
                <div class="p-4 border-b font-bold text-xl">Chats</div>
                <div id="chat-list" class="flex-1 overflow-y-auto divide-y"></div>
            </div>
            <div id="chat-box-area" class="hidden md:flex flex-1 flex-col bg-gray-50">
                <div id="active-chat-header" class="p-4 bg-white border-b font-bold">Select a chat</div>
                <div id="messages-container" class="flex-1 p-4 overflow-y-auto space-y-3"></div>
                <div class="p-3 bg-white border-t flex items-center space-x-2">
                    <input type="text" id="message-input" placeholder="Type a message..." class="flex-1 p-2 rounded-full border px-4 focus:outline-none">
                    <button onclick="sendMessage()" class="bg-pink-500 text-white px-5 py-2 rounded-full">Send</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://dwwubrcbwmxckeklfkan.supabase.co';
        const SUPABASE_ANON_KEY = 'Sb_publishable_p1sRpKZnPVyyc-KkEbHWPQ_tkyRTfCu';
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let isSignUp = false;
        let currentUser = null;
        let activeChatUserId = null;

        function toggleAuthMode() {
            isSignUp = !isSignUp;
            const usernameField = document.getElementById('username-field');
            const authBtn = document.getElementById('auth-btn');
            const authToggleBtn = document.getElementById('auth-toggle-btn');
            
            if (isSignUp) {
                usernameField.classList.remove('hidden');
                authBtn.innerText = 'Sign Up';
                authToggleBtn.innerText = 'Already have an account? Log In';
            } else {
                usernameField.classList.add('hidden');
                authBtn.innerText = 'Log In';
                authToggleBtn.innerText = 'Create new account';
            }
        }

        async function handleAuth(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('auth-error');
            errorDiv.classList.add('hidden');

            if (isSignUp) {
                const username = document.getElementById('username').value;
                if (!username) {
                    errorDiv.innerText = 'Please enter a username';
                    errorDiv.classList.remove('hidden');
                    return;
                }
                const { data, error } = await supabase.auth.signUp({ email, password });
                if (error) { errorDiv.innerText = error.message; errorDiv.classList.remove('hidden'); return; }
                if (data.user) {
                    await supabase.from('profiles').insert([{ id: data.user.id, username: username, full_name: username }]);
                    alert('Sign up successful! Please log in.');
                    toggleAuthMode();
                }
            } else {
                const { data, error } = await supabase.auth.signInWithPassword({ email, password });
                if (error) { errorDiv.innerText = error.message; errorDiv.classList.remove('hidden'); return; }
                checkUser();
            }
        }

        async function checkUser() {
            const { data: { session } } = await supabase.auth.getSession();
            if (session) {
                currentUser = session.user;
                document.getElementById('auth-container').classList.add('hidden');
                document.getElementById('app-container').classList.remove('hidden');
                loadUsers();
            }
        }

        async function logout() {
            await supabase.auth.signOut();
            location.reload();
        }

        async function loadUsers() {
            const { data } = await supabase.from('profiles').select('*').neq('id', currentUser.id);
            const chatList = document.getElementById('chat-list');
            chatList.innerHTML = '';
            if (data && data.length > 0) {
                data.forEach(user => {
                    const div = document.createElement('div');
                    div.className = 'p-3 flex items-center space-x-3 cursor-pointer hover:bg-gray-100';
                    div.innerHTML = `<div class="w-10 h-10 rounded-full bg-pink-500 text-white flex items-center justify-center font-bold">${user.username[0].toUpperCase()}</div>
                                     <div><div class="font-semibold">${user.username}</div></div>`;
                    div.onclick = () => selectChatUser(user.id, user.username);
                    chatList.appendChild(div);
                });
            } else {
                chatList.innerHTML = '<div class="p-4 text-center text-gray-500 text-sm">No other users found.</div>';
            }
        }

        function selectChatUser(userId, username) {
            activeChatUserId = userId;
            document.getElementById('active-chat-header').innerText = `Chat with ${username}`;
            loadMessages();
        }

        async function loadMessages() {
            if (!activeChatUserId) return;
            const { data } = await supabase.from('messages')
                .select('*')
                .or(`and(sender_id.eq.${currentUser.id},receiver_id.eq.${activeChatUserId}),and(sender_id.eq.${activeChatUserId},receiver_id.eq.${currentUser.id})`)
                .order('created_at', { ascending: true });

            const container = document.getElementById('messages-container');
            container.innerHTML = '';
            if (data) {
                data.forEach(msg => {
                    const isMe = msg.sender_id === currentUser.id;
                    const div = document.createElement('div');
                    div.className = `flex ${isMe ? 'justify-end' : 'justify-start'}`;
                    div.innerHTML = `<div class="p-3 rounded-2xl max-w-xs ${isMe ? 'bg-pink-500 text-white' : 'bg-gray-200'}">${msg.content}</div>`;
                    container.appendChild(div);
                });
                container.scrollTop = container.scrollHeight;
            }
        }

        async function sendMessage() {
            const input = document.getElementById('message-input');
            const content = input.value.trim();
            if (!content || !activeChatUserId) return;

            const { error } = await supabase.from('messages').insert([
                { sender_id: currentUser.id, receiver_id: activeChatUserId, content: content }
            ]);

            if (!error) {
                input.value = '';
                loadMessages();
            }
        }

        checkUser();
    </script>
</body>
</html>
