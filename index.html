<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dating Chat App</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        facebook: {
                            blue: '#1877f2',
                            hover: '#166fe5',
                            darkbg: '#18191a',
                            darkcard: '#242526',
                            darkhover: '#3a3b3c'
                        }
                    }
                }
            }
        }
    </script>
    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 dark:bg-facebook-darkbg text-gray-900 dark:text-gray-100 min-h-screen flex flex-col transition-colors duration-200">

    <!-- Auth Container (Login / Register) -->
    <div id="auth-container" class="flex items-center justify-center min-h-screen p-4">
        <div class="bg-white dark:bg-facebook-darkcard p-6 rounded-xl shadow-lg w-full max-w-md border border-gray-200 dark:border-gray-700 text-center">
            <!-- App Logo -->
            <div class="flex justify-center mb-3">
                <img src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=150&auto=format&fit=crop&q=80" alt="Logo" class="w-20 h-20 rounded-2xl object-cover shadow-md border-2 border-pink-500">
            </div>
            <h1 class="text-3xl font-bold text-pink-500 mb-6">Dating Chat</h1>
            <div id="auth-error" class="hidden bg-red-100 text-red-600 p-3 rounded-lg mb-4 text-sm"></div>
            
            <form id="auth-form" onsubmit="handleAuth(event)" class="text-left">
                <div id="username-field" class="mb-4 hidden">
                    <label class="block text-sm font-medium mb-1">Username</label>
                    <input type="text" id="username" class="w-full p-3 rounded-lg border dark:border-gray-700 dark:bg-facebook-darkbg focus:outline-none focus:border-pink-500">
                </div>
                <div class="mb-4">
                    <label class="block text-sm font-medium mb-1">Email</label>
                    <input type="email" id="email" required class="w-full p-3 rounded-lg border dark:border-gray-700 dark:bg-facebook-darkbg focus:outline-none focus:border-pink-500">
                </div>
                <div class="mb-4">
                    <label class="block text-sm font-medium mb-1">Password</label>
                    <input type="password" id="password" required class="w-full p-3 rounded-lg border dark:border-gray-700 dark:bg-facebook-darkbg focus:outline-none focus:border-pink-500">
                </div>
                <button type="submit" id="auth-btn" class="w-full bg-gradient-to-r from-pink-500 to-purple-600 hover:opacity-90 text-white font-bold p-3 rounded-lg transition">Log In</button>
            </form>
            
            <div class="text-center mt-4">
                <button onclick="toggleAuthMode()" id="auth-toggle-btn" class="text-sm text-pink-500 hover:underline">Create new account</button>
            </div>
        </div>
    </div>

    <!-- Main App Container (Hidden until logged in) -->
    <div id="app-container" class="hidden flex flex-col h-screen">
        <!-- Top Navbar -->
        <header class="bg-white dark:bg-facebook-darkcard border-b dark:border-gray-700 px-4 py-2 flex items-center justify-between sticky top-0 z-50">
            <div class="flex items-center space-x-2">
                <span class="text-2xl font-bold bg-gradient-to-r from-pink-500 to-purple-600 bg-clip-text text-transparent">Dating Chat</span>
            </div>
            <div class="flex items-center space-x-3">
                <button onclick="toggleDarkMode()" class="w-10 h-10 rounded-full bg-gray-200 dark:bg-facebook-darkhover flex items-center justify-center">
                    <i id="theme-icon" class="fa-solid fa-moon"></i>
                </button>
                <button onclick="logout()" class="w-10 h-10 rounded-full bg-red-100 text-red-600 flex items-center justify-center hover:bg-red-200">
                    <i class="fa-solid fa-right-from-bracket"></i>
                </button>
            </div>
        </header>

        <!-- Content Area -->
        <div class="flex flex-1 overflow-hidden">
            <!-- Sidebar / Chat List -->
            <div class="w-full md:w-80 bg-white dark:bg-facebook-darkcard border-r dark:border-gray-700 flex flex-col">
                <div class="p-4 border-b dark:border-gray-700 font-bold text-xl">Chats</div>
                <div id="chat-list" class="flex-1 overflow-y-auto divide-y dark:divide-gray-700">
                    <!-- Dynamic Users List will load here -->
                </div>
            </div>

            <!-- Chat Box Area -->
            <div id="chat-box-area" class="hidden md:flex flex-1 flex-col bg-gray-50 dark:bg-facebook-darkbg">
                <div id="active-chat-header" class="p-4 bg-white dark:bg-facebook-darkcard border-b dark:border-gray-700 font-bold flex items-center space-x-3">
                    <div class="w-8 h-8 rounded-full bg-pink-500 text-white flex items-center justify-center font-bold text-sm" id="active-user-avatar">?</div>
                    <span id="active-chat-username">Select a chat</span>
                </div>
                <div id="messages-container" class="flex-1 p-4 overflow-y-auto space-y-3">
                    <!-- Messages will load here -->
                </div>
                <div class="p-3 bg-white dark:bg-facebook-darkcard border-t dark:border-gray-700 flex items-center space-x-2">
                    <input type="text" id="message-input" placeholder="Type a message..." class="flex-1 p-2 rounded-full border dark:border-gray-700 dark:bg-facebook-darkbg focus:outline-none px-4">
                    <button onclick="sendMessage()" class="bg-pink-500 text-white w-10 h-10 rounded-full flex items-center justify-center hover:bg-pink-600">
                        <i class="fa-solid fa-paper-plane"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Script Logic -->
    <script>
        const SUPABASE_URL = 'https://dwwubrcbwmxckeklfkan.supabase.co';
        const SUPABASE_ANON_KEY = 'Sb_publishable_p1sRpKZnPVyyc-KkEbHWPQ_tkyRTfCu';
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let isSignUp = false;
        let currentUser = null;
        let activeChatUserId = null;

        // Dark Mode Toggle
        function toggleDarkMode() {
            document.documentElement.classList.toggle('dark');
            const icon = document.getElementById('theme-icon');
            icon.classList.toggle('fa-moon');
            icon.classList.toggle('fa-sun');
        }

        // Toggle Auth Form
        function toggleAuthMode() {
            isSignUp = !isSignUp;
            document.getElementById('username-field').classList.toggle('hidden');
            document.getElementById('auth-btn').innerText = isSignUp ? 'Sign Up' : 'Log In';
            document.getElementById('auth-toggle-btn').innerText = isSignUp ? 'Already have an account? Log In' : 'Create new account';
        }

        // Auth Handler
        async function handleAuth(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const username = document.getElementById('username').value;
            const errorDiv = document.getElementById('auth-error');
            errorDiv.classList.add('hidden');

            if (isSignUp) {
                const { data, error } = await supabase.auth.signUp({ email, password });
                if (error) { errorDiv.innerText = error.message; errorDiv.classList.remove('hidden'); return; }
                if (data.user) {
                    await supabase.from('profiles').insert([{ id: data.user.id, username: username, full_name: username }]);
                    alert('Sign up successful! Please log in.');
                    toggleAuthMode();
                }
            } else {
                const { data, error } = await supabase.auth.signInWithPassword({ email, password });
                if (error) { errorDiv.innerText = error.message; errorDiv.classList.remove('hidden'); return; }
                checkUser();
            }
        }

        async function checkUser() {
            const { data: { session } } = await supabase.auth.getSession();
            if (session) {
                currentUser = session.user;
                document.getElementById('auth-container').classList.add('hidden');
                document.getElementById('app-container').classList.remove('hidden');
                loadUsers();
                setupRealtimeMessages();
            }
        }

        async function logout() {
            await supabase.auth.signOut();
            location.reload();
        }

        // Load Users for Chat List
        async function loadUsers() {
            const { data, error } = await supabase.from('profiles').select('*').neq('id', currentUser.id);
            const chatList = document.getElementById('chat-list');
            chatList.innerHTML = '';
            if (data && data.length > 0) {
                data.forEach(user => {
                    const div = document.createElement('div');
                    div.className = 'p-3 flex items-center space-x-3 cursor-pointer hover:bg-gray-100 dark:hover:bg-facebook-darkhover transition';
                    div.innerHTML = `<div class="w-10 h-10 rounded-full bg-pink-500 text-white flex items-center justify-center font-bold">${user.username[0].toUpperCase()}</div>
                                     <div><div class="font-semibold">${user.username}</div></div>`;
                    div.onclick = () => selectChatUser(user.id, user.username);
                    chatList.appendChild(div);
                });
            } else {
                chatList.innerHTML = '<div class="p-4 text-center text-gray-500 text-sm">No other users found yet.</div>';
            }
        }

        function selectChatUser(userId, username) {
            activeChatUserId = userId;
            document.getElementById('active-chat-username').innerText = username;
            document.getElementById('active-user-avatar').innerText = username[0].toUpperCase();
            loadMessages();
        }

        // Load Messages
        async function loadMessages() {
            if (!activeChatUserId) return;
            const { data, error } = await supabase.from('messages')
                .select('*')
                .or(`and(sender_id.eq.${currentUser.id},receiver_id.eq.${activeChatUserId}),and(sender_id.eq.${activeChatUserId},receiver_id.eq.${currentUser.id})`)
                .order('created_at', { ascending: true });

            const container = document.getElementById('messages-container');
            container.innerHTML = '';
            if (data) {
                data.forEach(msg => {
                    const isMe = msg.sender_id === currentUser.id;
                    const div = document.createElement('div');
                    div.className = `flex ${isMe ? 'justify-end' : 'justify-start'}`;
                    div.innerHTML = `<div class="p-3 rounded-2xl max-w-xs ${isMe ? 'bg-pink-500 text-white' : 'bg-gray-200 dark:bg-facebook-darkhover'}">${msg.content}</div>`;
                    container.appendChild(div);
                });
                container.scrollTop = container.scrollHeight;
            }
        }

        // Send Message
        async function sendMessage() {
            const input = document.getElementById('message-input');
            const content = input.value.trim();
            if (!content || !activeChatUserId) return;

            const { error } = await supabase.from('messages').insert([
                { sender_id: currentUser.id, receiver_id: activeChatUserId, content: content }
            ]);

            if (!error) {
                input.value = '';
                loadMessages();
            }
        }

        // Realtime Subscription
        function setupRealtimeMessages() {
            supabase.channel('public:messages')
                .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, payload => {
                    if ((payload.new.sender_id === activeChatUserId && payload.new.receiver_id === currentUser.id) ||
                        (payload.new.sender_id === currentUser.id && payload.new.receiver_id === activeChatUserId)) {
                        loadMessages();
                    }
                })
                .subscribe();
        }

        checkUser();
    </script>
</body>
</html>
